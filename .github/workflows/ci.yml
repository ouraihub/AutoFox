name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify (windows)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install the pinned Rust toolchain
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The mux tests run a real ffmpeg from lib/ (not committed): same 9.0.2 essentials build as local.
      - name: Fetch ffmpeg for the mux tests
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'ffmpeg.zip'
          Invoke-WebRequest https://github.com/GyanD/codexffmpeg/releases/download/9.0.2/ffmpeg-9.0.2-essentials_build.zip -OutFile $zip
          Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP
          Copy-Item "$env:RUNNER_TEMP/ffmpeg-9.0.2-essentials_build/bin/ffmpeg.exe", "$env:RUNNER_TEMP/ffmpeg-9.0.2-essentials_build/bin/ffprobe.exe" lib/
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - run: pnpm install --frozen-lockfile
      - name: Enforce runner compiler ownership
        shell: cmd
        run: call node_modules\@ouraihub\desktop-kit\msvc\msvc-env.bat
      - run: pnpm run verify
